[project]
name = "clasharness"
version = "0.1.0"
description = "A second-screen harness for Clash Royale: phone mirroring, elixir and cycle tracking, opponent deck prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pynput>=1.7",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "anthropic>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
clasharness = "clasharness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clasharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real Clash Royale API (needs config.toml with a token)"]
addopts = "-m 'not live'"
