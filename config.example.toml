# Copy to config.toml and fill in. Anything you leave out uses the defaults in
# src/clasharness/config.py.

[api]
# Create a key at https://developer.clashroyale.com and whitelist the RoyaleAPI
# proxy IP (see README), not your own IP.
token = ""
base_url = "https://proxy.royaleapi.dev/v1"
my_tag = ""  # your player tag, e.g. "#ABC123"

[openrouter]
# Used to read the opponent's name off the screen. Leave empty to use OPENROUTER_API_KEY.
api_key = ""
base_url = "https://openrouter.ai/api/v1"
# Any OpenRouter model with image input works. Don't use deepseek/deepseek-flash-latest:
# that alias is text-only.
model = "deepseek/deepseek-v4.1-flash"

[server]
host = "127.0.0.1"
port = 8765
open_browser = true

[phone]
# Show the phone's screen inside the app. Needs scrcpy installed (brew install scrcpy):
# it uses the scrcpy-server file that comes with it. Set to false to use the separate
# scrcpy window ([scrcpy] below) instead.
embed = true
max_size = 1600      # longest side of the video in pixels
bit_rate = 8000000
max_fps = 60
# serial = "R5CX1234ABC"   # only if more than one phone/emulator is connected (see `adb devices`)

# The separate scrcpy window. Only autostarts when [phone].embed is false.
[scrcpy]
enabled = true
autostart = true
path = "scrcpy"
args = ["--stay-awake", "--window-title=Clash Royale", "--max-size=1600"]
# Over Wi-Fi instead of USB: add "--tcpip" (or "--tcpip=192.168.1.23").

[vision]
enabled = true
identify_on_start = true
# Seconds after Start before the screenshot (the name banner needs to be on screen).
delay_seconds = 1.5
# If the name isn't on screen yet (Start pressed during matchmaking), try again every
# retry_seconds for up to retry_for_seconds.
retry_seconds = 2.0
retry_for_seconds = 20.0
# Opponent name/clan banner as fractions of the screen: [x0, y0, x1, y1].
# Check it in the UI under Setup → Name crop calibration.
crop = [0.0, 0.0, 0.75, 0.085]

[elixir]
# Ladder / Path of Legends. Change if Supercell changes the rules.
start = 5.0
max = 10.0
seconds_per_elixir = 2.8
regulation_seconds = 180
end = 300
phases = [
  { start = 0, multiplier = 1, name = "Single elixir" },
  { start = 120, multiplier = 2, name = "Double elixir" },
  { start = 180, multiplier = 2, name = "Overtime" },
  { start = 240, multiplier = 3, name = "Overtime x3" },
]

[predict]
min_support = 15          # decks needed before trusting exact matches
max_deck_age_days = 21    # ignore decks not seen recently (meta shifts)
history_weight = 0.8      # how much the opponent's own recent decks count
trophy_window = 800       # crawl players within this many trophies of you
trickle_players = 15      # background crawl size…
trickle_interval_seconds = 600  # …and how often

[hotkeys]
enabled = true
# Defaults depend on the platform (see README). On macOS everything uses Ctrl, because
# Option+letter types a symbol and won't match. Override any of them here in pynput
# syntax, e.g.  start = "<ctrl>+g"   or   my_cards = ["<ctrl>+1", ...]
# In coach mode, plain keys 1-8 log the opponent's 8 slots: coach_opp = ["1", ..., "8"]
